
[project]
name = "multi-agent-ai-system"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph==1.1.0",
    "langgraph-checkpoint-sqlite==3.0.3",
    "langchain-core==1.3.3",
    "langchain-ollama==1.0.0",
    "mcp==1.26.0",
    "a2a-sdk==0.3.25",
    "crewai==1.13.0",
    "langfuse==4.0.1",
    "deepeval==3.9.1",
    "litellm==1.82.4",
    "openai==2.8.0",
    "httpx==0.28.1",
    "fastapi==0.115.0",
    "uvicorn==0.34.0",
    "streamlit==1.43.2",
    "pydantic==2.11.9",
    "python-dotenv==1.1.1",
    "tenacity==8.5.0",
    "langchain-openai>=1.0.1",
    "langchain>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not eval'"
asyncio_default_fixture_loop_scope = "function"

markers = [
    "unit: fast tests, no external dependencies",
    "eval: slow evaluation tests requiring Ollama",
]

[tool.pyright]
pythonPath = "src"
